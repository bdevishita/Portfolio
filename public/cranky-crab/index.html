<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cranky Crab's Happy Day — Lab — Ishita Dev</title>
<meta name="description" content="A picture book about a grumpy crab who finds out that a little friendship makes a very big difference. A client project, shown as a page-turning 3D book.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sea-1:#0b4f7a; --sea-2:#06304f; --sea-3:#031a2e;
  --sand:#f6c445; --ink:#f4fbff; --mute:#9fc4da; --coral:#ff6a3d;
  --ui:'Fredoka',system-ui,sans-serif;
  --bw:min(94vw,calc((100svh - 150px)*2),1500px); /* book width = two pages */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% -10%,var(--sea-1) 0%,var(--sea-2) 55%,var(--sea-3) 100%);
  color:var(--ink);font-family:var(--ui);overflow:hidden;
  display:flex;flex-direction:column;min-height:100svh;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
}
/* light rays + bubbles */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:conic-gradient(from 180deg at 50% -20%,transparent 0 40%,rgba(160,225,255,.10) 45%,transparent 50%,rgba(160,225,255,.07) 56%,transparent 62% 100%);
  opacity:.9}
.bub{position:fixed;bottom:-30px;border-radius:50%;border:1.5px solid rgba(190,235,255,.35);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx))}}

header.bar{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 0;font-size:14px}
header.bar a{color:var(--ink);text-decoration:none;display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:background .2s}
header.bar a:hover,header.bar a:focus-visible{background:rgba(255,255,255,.18);outline:none}
header.bar .t{color:var(--mute);letter-spacing:.02em}
header.bar .t b{color:var(--ink);font-weight:600}

main{flex:1;display:grid;place-items:center;position:relative;z-index:2;min-height:0}
.scene{perspective:2600px;width:var(--bw);display:grid;place-items:center}
.tilt{width:var(--bw);transform:rotateX(16deg);transform-origin:50% 90%}
.book{position:relative;width:var(--bw);aspect-ratio:2/1;perspective:2400px;transition:transform 1.1s cubic-bezier(.5,.05,.2,1);cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.book[data-mode="closed"]{transform:translateX(-25%)}
.book[data-mode="end"]{transform:translateX(25%)}
.floor{position:absolute;left:4%;right:4%;bottom:-6%;height:12%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,10,25,.65),rgba(0,10,25,0) 70%);filter:blur(8px);transition:transform 1.1s cubic-bezier(.5,.05,.2,1)}

/* hard boards behind the pages */
.board{position:absolute;top:-1.6%;height:103.2%;width:50.8%;background:linear-gradient(90deg,#c9482a,#e9643a);border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.25);transition:opacity .6s}
.board.l{left:-.8%;border-radius:10px 2px 2px 10px}
.board.r{right:-.8%;border-radius:2px 10px 10px 2px;background:linear-gradient(270deg,#c9482a,#e9643a)}
.book[data-mode="closed"] .board.l{opacity:0}
.book[data-mode="end"] .board.r{opacity:0}
/* page block thickness */
.stack{position:absolute;top:.6%;height:98.8%;width:var(--sw,0px);background:repeating-linear-gradient(90deg,#f1eadb 0 2px,#d9d0bc 2px 3px);transition:width .6s}
.stack.l{right:50%;border-radius:2px 0 0 2px}
.stack.r{left:50%;border-radius:0 2px 2px 0}

.sheet{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.55,.06,.25,1)}
.sheet.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#0b4f7a}
.face img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.face.front{border-radius:0 6px 6px 0}
.face.back{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(0,20,40,.38) 0,rgba(0,20,40,0) 7%),linear-gradient(270deg,rgba(255,255,255,.10),transparent 3%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,20,40,.38) 0,rgba(0,20,40,0) 7%),linear-gradient(90deg,rgba(255,255,255,.10),transparent 3%)}
/* shade that sweeps over a page while it turns */
.face::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(0,15,35,.55),rgba(0,15,35,0));opacity:0}
.sheet.turning .face::before{animation:shade 1.15s ease-in-out}
@keyframes shade{0%,100%{opacity:0}50%{opacity:1}}

.hint{position:absolute;left:75%;bottom:-3%;transform:translateX(-50%);z-index:300;font-size:14px;background:var(--sand);color:#3a2300;padding:8px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:nudge 1.6s ease-in-out infinite alternate;pointer-events:none;white-space:nowrap}
.hint[hidden]{display:none}
@keyframes nudge{to{transform:translateX(-50%) translateY(-5px)}}

footer.ctl{position:relative;z-index:5;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 0 18px;flex-wrap:wrap}
.ctl button{font-family:var(--ui);font-size:15px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 20px;cursor:pointer;transition:transform .2s,background .2s;min-width:92px}
.ctl button:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.2)}
.ctl button:disabled{opacity:.35;cursor:default}
.ctl button:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.ctl button.go{background:var(--sand);color:#3a2300;border-color:var(--sand)}
.count{min-width:150px;text-align:center;color:var(--mute);font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;width:100%}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .3s,transform .3s}
.dots i.on{background:var(--sand);transform:scale(1.35)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.turn{display:none;text-align:center;color:var(--mute);font-size:14px;padding:0 0 6px}
@media (orientation:portrait) and (max-width:700px){.turn{display:block}.board,.stack{display:none}header.bar .t{display:none}}
@media (prefers-reduced-motion:reduce){.sheet,.book,.floor{transition-duration:.01s}.sheet.turning .face::before{animation:none}.bub{display:none}}
</style>
</head>
<body>
<header class="bar">
  <a href="/labs/cranky-crab"><span aria-hidden="true">←</span> Lab</a>
  <span class="t"><b>Cranky Crab's Happy Day</b> · client project</span>
</header>

<main>
  <div class="scene">
    <div class="tilt">
      <div class="book" id="book" data-mode="closed" role="group" aria-label="Picture book. Use the arrow keys or the buttons to turn pages.">
        <div class="floor"></div>
        <div class="board l"></div><div class="board r"></div>
        <div class="stack l" id="stackL"></div><div class="stack r" id="stackR"></div>
        <div id="sheets"></div>
        <div class="hint" id="hint">Tap the book to open it</div>
      </div>
    </div>
  </div>
</main>
<p class="turn">Turn your phone sideways for a bigger book.</p>

<footer class="ctl">
  <button id="prev" type="button" aria-label="Previous page">← Back</button>
  <span class="count" id="count" aria-live="off">Cover</span>
  <button id="next" type="button" class="go" aria-label="Next page">Next →</button>
  <div class="dots" id="dots" aria-hidden="true"></div>
</footer>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
  var IMG='/cranky-crab/img/';
  /* Spreads in reading order. file = prefix of the page images, */
  var SPREADS=[
    {file:'s1',text:'Deep, deep down in the bubbly blue sea… lived a little cranky crab. Lonely and grumpy as can be. Grump. Grump. Grump!'},
    {file:'s2',text:'The silly clownfish swished by. Wiggle! Giggle! Whoosh! Cranky Crab frowned. Too noisy! Hmph!'},
    {file:'s6',text:'The seaweed danced. Tickling the cranky crab and making him umph. Swoosh! Swish!'},
    {file:'s7',text:'One day… Cranky Crab decided to explore. He couldn’t take being cranky anymore. Clomp! Clomp! Clomp! Across the ridge he went.'},
    {file:'s5',text:'On the other side… He met another crab. The crab waved. Hello! And played in the sand.'},
    {file:'s3',text:'Cranky Crab blinked. He couldn’t believe his eyes. He didn’t realize crabs could be happy hanging out in the sea all this time.'},
    {file:'s4',text:'Cranky Crab took a deep breath and came out of his shell and together they played around all day. Pop! Splash! Swish!'}
  ];
  var N=SPREADS.length+1;           // sheets
  var COVER_TEXT='Cranky Crab’s Happy Day. A smiling orange crab waves both claws on the sea floor.';
  var BACK_TEXT='Meet Cranky Crab. He’s grumpy. He’s lonely. And he’s ready for a change. Join Cranky Crab on a colourful underwater adventure as he discovers that a little friendship can make a very big difference.';

  var book=document.getElementById('book'),sheetsEl=document.getElementById('sheets'),
      prevB=document.getElementById('prev'),nextB=document.getElementById('next'),count=document.getElementById('count'),live=document.getElementById('live');
  var dots=document.getElementById('dots'),hint=document.getElementById('hint');
  var sheets=[],cur=0;

  function mkImg(src,alt,eager){var i=new Image();i.src=IMG+src;i.alt=alt||'';i.decoding='async';if(!eager)i.loading='lazy';i.draggable=false;return i}
  function face(cls,src,alt,eager){var d=document.createElement('div');d.className='face '+cls;d.appendChild(mkImg(src,alt,eager));return d}

  for(var k=0;k<N;k++){
    var s=document.createElement('div');s.className='sheet';
    var frontSrc=k===0?'cover.webp':'s'+SPREADS[k-1].file.slice(1)+'r.webp';
    // spread k (1-based) right half is on sheet k; its left half is the back of sheet k-1
    var front=face('front',k===0?'cover.webp':SPREADS[k-1].file+'r.webp','',k<2);
    var back=face('back',k<N-1?SPREADS[k].file+'l.webp':'back.webp','',k<2);
    s.appendChild(front);s.appendChild(back);sheetsEl.appendChild(s);sheets.push(s);
  }
  for(var d=0;d<=N;d++){var i=document.createElement('i');dots.appendChild(i)}

  function layoutZ(){sheets.forEach(function(s,k){s.style.zIndex=k<cur?k+1:N-k+1})}

  function pageLabel(){
    if(cur===0)return'Cover';
    if(cur===N)return'The end';
    return'Pages '+(cur*2)+'–'+(cur*2+1)+' of '+(SPREADS.length*2+1);
  }
  function render(flipFrom){
    book.dataset.mode=cur===0?'closed':(cur===N?'end':'open');
    layoutZ();
    sheets.forEach(function(s,k){s.classList.toggle('flipped',k<cur)});
    if(flipFrom!==undefined){
      var moved=sheets[Math.min(flipFrom,cur)];
      if(moved){moved.classList.remove('turning');void moved.offsetWidth;moved.classList.add('turning')}
    }
    var read=Math.min(cur,N-1),left=N-cur;
    book.style.setProperty('--sw','0px');
    document.getElementById('stackL').style.setProperty('--sw',Math.min(cur,8)*1.6+'px');
    document.getElementById('stackR').style.setProperty('--sw',Math.min(N-cur,8)*1.6+'px');
    prevB.disabled=cur===0;nextB.disabled=cur===N;
    nextB.textContent=cur===0?'Open the book':(cur===N-1?'Last page →':'Next →');
    if(cur===N)nextB.textContent='Next →';
    count.textContent=pageLabel();
    live.textContent=cur===0?COVER_TEXT:(cur===N?BACK_TEXT:SPREADS[cur-1].text);
    Array.prototype.forEach.call(dots.children,function(d,i){d.classList.toggle('on',i===cur)});
    hint.hidden=cur!==0;
    preload();
  }
  function preload(){
    [cur+1,cur+2].forEach(function(k){
      if(k<N){mkImg(SPREADS[Math.min(k,SPREADS.length)-1].file+'l.webp','',true)}
    });
  }
  function go(n){
    n=Math.max(0,Math.min(N,n));if(n===cur)return;
    var from=cur;cur=n;render(n>from?from:n);
    try{history.replaceState(null,'','#'+cur)}catch(e){}
  }
  prevB.onclick=function(){go(cur-1)};nextB.onclick=function(){go(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1),e.preventDefault();
    else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1),e.preventDefault();
    else if(e.key==='Home')go(0);else if(e.key==='End')go(N);
  });

  /* click a page to turn it; drag sideways to flip */
  var sx=null,moved=false;
  book.addEventListener('pointerdown',function(e){sx=e.clientX;moved=false});
  book.addEventListener('pointermove',function(e){
    var r=book.getBoundingClientRect();
    var mx=((e.clientX-r.left)/r.width-.5)*2,my=((e.clientY-r.top)/r.height-.5)*2;
        if(sx!==null&&Math.abs(e.clientX-sx)>40&&!moved){moved=true;go(cur+(e.clientX<sx?1:-1))}
  });
  window.addEventListener('pointerup',function(){sx=null});
  book.addEventListener('click',function(e){
    if(moved){moved=false;return}
    var r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
    if(cur===0)go(1);else if(cur===N)go(N-1);else go(cur+(x>.5?1:-1));
  });

  /* bubbles */
  for(var b=0;b<14;b++){var e=document.createElement('span');e.className='bub';var z=6+Math.random()*16;
    e.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(14+Math.random()*16)+'s;animation-delay:-'+Math.random()*20+'s;--dx:'+((Math.random()-.5)*80)+'px';
    document.body.appendChild(e)}

  var h=parseInt((location.hash||'').slice(1),10);
  if(!isNaN(h)&&h>0&&h<=N)cur=h;
  render();
})();
</script>
</body>
</html>
